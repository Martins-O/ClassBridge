name: CI

on:
  push:
    branches: [indev, main]
  pull_request:
    branches: [indev, main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./Backend

      - name: Run ESLint
        run: npm run lint
        working-directory: ./Backend

      - name: Run tests
        run: npm test
        working-directory: ./Backend
