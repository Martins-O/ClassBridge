name: Deploy to Staging

on:
  push:
    branches: [indev]

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy
        uses: actions/github-script@v7
        with:
          script: |
            const response = await fetch(process.env.RENDER_DEPLOY_HOOK_URL, {
              method: 'POST',
            });
            if (!response.ok) {
              throw new Error(`Failed to trigger deploy: ${response.statusText}`);
            }
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}

      - name: Wait for deployment
        run: sleep 30

      - name: Health check staging
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" "${{ vars.RENDER_STAGING_URL }}/health" || echo "Health check may still be starting"
